<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <style>
    .g { fill: #00a800; }
    .w { fill: #fff; }
    .s { fill: #f8d8b0; }
    .k { fill: #000; }
  </style>
  <!-- cap top -->
  <rect class="g" x="4" y="0" width="8" height="1"/>
  <rect class="g" x="2" y="1" width="12" height="1"/>
  <!-- cap + white spots -->
  <rect class="g" x="1" y="2" width="14" height="1"/>
  <rect class="w" x="2" y="2" width="3" height="1"/>
  <rect class="w" x="11" y="2" width="3" height="1"/>
  <rect class="g" x="1" y="3" width="14" height="1"/>
  <rect class="w" x="1" y="3" width="4" height="1"/>
  <rect class="w" x="11" y="3" width="4" height="1"/>
  <rect class="g" x="0" y="4" width="16" height="1"/>
  <rect class="w" x="0" y="4" width="4" height="1"/>
  <rect class="w" x="12" y="4" width="4" height="1"/>
  <rect class="g" x="0" y="5" width="16" height="1"/>
  <rect class="w" x="0" y="5" width="3" height="1"/>
  <rect class="w" x="13" y="5" width="3" height="1"/>
  <rect class="g" x="0" y="6" width="16" height="1"/>
  <rect class="g" x="1" y="7" width="14" height="1"/>
  <!-- face -->
  <rect class="s" x="3" y="8" width="10" height="1"/>
  <rect class="s" x="3" y="9" width="10" height="1"/>
  <rect class="k" x="5" y="9" width="2" height="1"/>
  <rect class="k" x="9" y="9" width="2" height="1"/>
  <rect class="s" x="3" y="10" width="10" height="1"/>
  <rect class="s" x="4" y="11" width="8" height="1"/>
  <!-- stem -->
  <rect class="w" x="4" y="12" width="8" height="1"/>
  <rect class="w" x="3" y="13" width="10" height="1"/>
  <rect class="w" x="3" y="14" width="10" height="1"/>
  <!-- feet -->
  <rect class="g" x="2" y="15" width="5" height="1"/>
  <rect class="g" x="9" y="15" width="5" height="1"/>
</svg>
